# Profiling tasks: <problem> -> <method> -> <mode>: [start, stop, num]
#
# Particle counts are generated as np.logspace(start, stop, num, dtype=int),
# i.e., `num` log-spaced values from 10^start to 10^stop. One profiling run is
# performed for each value (e.g., [4, 6, 3] -> 1e4, 1e5, 1e6 particles).
# Use `run.py --N_particle` to override with a single particle count.

